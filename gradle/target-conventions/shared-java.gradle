def root = file('../..')
def layers = shared_sources.split(',').collect { new File(root, it.trim()) }
def generated = layout.buildDirectory.dir('generated/sources/shared')
def prepare = tasks.register('prepareSharedJava') {
    inputs.files(layers.collect { new File(it, 'src/main/java') })
    inputs.properties([minecraft_version: minecraft_version, loader: loader])
    outputs.dir(generated)
    doLast {
        def output = generated.get().asFile
        delete(output)
        layers.each { layer ->
            def source = new File(layer, 'src/main/java')
            if (!source.isDirectory()) return
            fileTree(source).matching { include '**/*.java' }.each { input ->
                if (input.name == 'EditBoxTextShadowMixin.java' &&
                        (loader == 'neoforge' || minecraft_version.startsWith('26.'))) return
                def result = []
                boolean active = true
                boolean matched = false
                boolean conditional = false
                input.readLines('UTF-8').each { line ->
                    if (line.startsWith('// @target ')) {
                        def directive = line.substring(11)
                        if (directive.startsWith('if ') || directive.startsWith('elif ')) {
                            if (directive.startsWith('if ')) {
                                if (conditional) throw new GradleException("Nested source condition: ${input}")
                                conditional = true
                                matched = false
                            }
                            def expression = directive.substring(directive.indexOf(' ') + 1)
                            def fields = [minecraft_version: minecraft_version, loader: loader]
                            active = !matched && expression.split(';').every { clause ->
                                def pair = clause.split('=', 2)
                                pair.length == 2 && pair[1].split(',').contains(fields[pair[0]])
                            }
                            matched |= active
                        } else if (directive == 'else') {
                            active = !matched
                        } else if (directive == 'end') {
                            active = true
                            conditional = false
                        } else {
                            throw new GradleException("Unknown source condition in ${input}: ${directive}")
                        }
                    } else if (active) {
                        result.add(line.startsWith('//|') ? line.substring(3) : line)
                    }
                }
                if (conditional) throw new GradleException("Unclosed source condition: ${input}")
                def text = result.join('\n') + '\n'
                if (minecraft_version.startsWith('26.')) {
                    text = text.replaceAll(/\bResourceLocation\b/, 'Identifier')
                            .replaceAll(/\bGuiGraphics\b/, 'GuiGraphicsExtractor')
                            .replaceAll(/\bClickType\b/, 'ContainerInput')
                            .replace('net.minecraft.Util', 'net.minecraft.util.Util')
                            .replace('org.jetbrains.annotations.Nullable', 'org.jspecify.annotations.Nullable')
                            .replace('graphics.drawString(', 'graphics.text(')
                            .replace('graphics.renderItem(', 'graphics.item(')
                            .replace('graphics.renderOutline(', 'graphics.outline(')
                }
                def target = new File(output, source.toPath().relativize(input.toPath()).toString())
                target.parentFile.mkdirs()
                target.setText(text, 'UTF-8')
            }
        }
    }
}
sourceSets.main.java.setSrcDirs([file('src/main/java'), generated,
                               layout.buildDirectory.dir('generated/sources/temple')])
tasks.named('compileJava') { dependsOn prepare }
tasks.named('sourcesJar') { dependsOn prepare }
tasks.withType(Javadoc).configureEach { dependsOn prepare }
dependencies {
    if (minecraft_version.startsWith('26.')) {
        compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
        compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
    } else if (loader != 'fabric') {
        compileOnly 'org.spongepowered:mixin:0.8.5'
    }
}
repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}
