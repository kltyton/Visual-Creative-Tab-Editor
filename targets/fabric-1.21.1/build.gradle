plugins {
    id 'java-library'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
    id 'fabric-loom' version '1.9-SNAPSHOT'
}
apply from: file('../../gradle/target-conventions/base.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = file("../../common/src/compat/minecraft/1.21.1/" + "resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version) }
}

apply from: file('../../gradle/target-conventions/publish.gradle')

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main, project(':common')
        }
    }
}
sourceSets.main.runtimeClasspath += project(':common').sourceSets.main.output
ext.templeMixinMappingServiceType = net.fabricmc.loom.task.service.MixinAPMappingService.TYPE
ext.templeTinyRemapperServiceClass = net.fabricmc.loom.task.service.TinyRemapperService.class
apply from: file('../../gradle/target-conventions/fabric-common-mixin.gradle')
