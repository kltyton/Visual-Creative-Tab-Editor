plugins {
    id 'java-library'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
    id 'net.neoforged.moddev' version '2.0.49-beta'
}
apply from: file('../../gradle/target-conventions/base.gradle')
apply from: file('../../gradle/target-conventions/shared-java.gradle')


neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = file("../../versions/1.21.1/" + 'src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    def neoForgeAt = file('src/main/resources/META-INF/neoforge-accesstransformer.cfg')
    if (neoForgeAt.exists()) {
        accessTransformers.from(neoForgeAt.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), *project.ext.templeDatagenExistingArgs

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

apply from: file('../../gradle/target-conventions/publish.gradle')
